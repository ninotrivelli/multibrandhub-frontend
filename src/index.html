<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="utf-8" />
    <title>MultiBrandHub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MultiBrandHub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the dark theme class before Angular boots to avoid a white flash
      // when the saved theme is "Oscuro". Kept in sync with core/theme.
      (function () {
        try {
          if (localStorage.getItem('mbh-theme') === 'dark') {
            document.documentElement.classList.add('app-dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
