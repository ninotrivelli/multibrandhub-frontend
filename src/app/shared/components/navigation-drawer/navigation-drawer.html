<p-drawer
  id="app-navigation-drawer"
  position="left"
  [visible]="true"
  [modal]="false"
  [dismissible]="false"
  [closable]="false"
  [blockScroll]="false"
  [styleClass]="drawerStyleClass()"
>
  <ng-template #header>
    <div class="drawer-header-row">
      @if (isMobile() || !collapsed()) {
        <span class="drawer-header-title">MultiBrandHub</span>
      }
      <p-button
        variant="text"
        severity="secondary"
        [rounded]="true"
        [text]="true"
        (click)="onToggleClick()"
        [attr.aria-expanded]="isMobile() ? mobileOpen() : !collapsed()"
        ariaLabel="Ocultar o mostrar menú"
      >
        <i-lucide [img]="toggleIcon()" class="size-5" />
      </p-button>
    </div>
  </ng-template>

  <nav class="drawer-nav" aria-label="Navegación principal">
    @for (link of links(); track link.path) {
      <a
        class="drawer-link"
        [class.drawer-link-collapsed]="!isMobile() && collapsed()"
        [routerLink]="link.path"
        routerLinkActive="drawer-link-active"
        [attr.title]="!isMobile() && collapsed() ? link.label : null"
        (click)="onLinkClick()"
      >
        @switch (link.icon.kind) {
          @case ('lucide') {
            <i-lucide [img]="link.icon.data" class="size-5 shrink-0" aria-hidden="true" />
          }
          @case ('fa') {
            <fa-icon [icon]="link.icon.def" class="drawer-link-icon shrink-0" aria-hidden="true" />
          }
        }
        @if (isMobile() || !collapsed()) {
          <span>{{ link.label }}</span>
        }
      </a>
    }
  </nav>
</p-drawer>
