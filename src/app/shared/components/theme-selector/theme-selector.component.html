<div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
  @for (theme of themes; track theme.id) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="current() === theme.id"
      (click)="select(theme.id)"
      class="relative flex cursor-pointer items-center gap-3 rounded-xl border p-4 text-left transition-colors hover:bg-surface-50 dark:hover:bg-surface-700/40 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      [class.border-primary]="current() === theme.id"
      [class.ring-1]="current() === theme.id"
      [class.ring-primary]="current() === theme.id"
      [class.border-surface-200]="current() !== theme.id"
      [class.dark:border-surface-700]="current() !== theme.id"
      [class.hover:border-surface-300]="current() !== theme.id"
      [class.dark:hover:border-surface-600]="current() !== theme.id"
    >
      <span class="flex shrink-0 -space-x-1.5">
        @for (color of theme.swatches; track $index) {
          <span
            class="size-6 rounded-full border border-surface-200 dark:border-surface-700"
            [style.background-color]="color"
          ></span>
        }
      </span>

      <span class="flex min-w-0 flex-1 flex-col gap-0.5">
        <span class="text-sm font-medium text-surface-900 dark:text-surface-0">
          {{ theme.label }}
        </span>
        <span class="text-xs text-surface-500 dark:text-surface-400">
          {{ theme.description }}
        </span>
      </span>

      @if (current() === theme.id) {
        <span
          class="flex size-5 shrink-0 items-center justify-center rounded-full bg-primary text-primary-contrast"
        >
          <i-lucide [img]="icons.Check" class="size-3.5" />
        </span>
      }
    </button>
  }
</div>
