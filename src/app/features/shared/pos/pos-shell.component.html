<div class="flex flex-col gap-5">
  <!-- Header -->
  <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">Ingresar Venta</h1>
      <p class="text-sm text-surface-500 dark:text-surface-400">
        Punto de venta unificado — combiná productos de cualquier marca en un mismo ticket.
      </p>
    </div>
    <button
      pButton
      type="button"
      [outlined]="true"
      label="Ingresar devolución"
      class="border-primary! text-primary!"
      (click)="returnDialogVisible.set(true)"
    >
      <i-lucide [img]="icons.Undo2" class="size-4 mr-2" />
    </button>
  </header>

  @if (noCashRegisterOpen()) {
    <section
      class="flex flex-col gap-3 rounded-lg border border-amber-200 bg-amber-50 p-4 dark:border-amber-900/60 dark:bg-amber-950/30 md:flex-row md:items-center md:justify-between"
    >
      <div class="flex items-start gap-3">
        <i-lucide
          [img]="icons.AlertTriangle"
          class="mt-0.5 size-5 text-amber-600 dark:text-amber-300"
        />
        <div>
          <h2 class="text-sm font-semibold text-amber-900 dark:text-amber-100">
            No hay una caja abierta
          </h2>
          <p class="text-sm text-amber-800 dark:text-amber-200">
            Podés ingresar ventas y devoluciones, pero quedarán fuera de una caja.
          </p>
        </div>
      </div>
      @if (canOpenCashRegister()) {
        <a
          pButton
          href="/seller/cash-register"
          severity="warn"
          [outlined]="true"
          class="self-start md:self-auto"
        >
          <i-lucide [img]="icons.Receipt" class="size-4 mr-2" />
          <span>Abrir Caja</span>
        </a>
      }
    </section>
  }

  <!-- Search + cart -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 items-start">
    <div class="lg:col-span-2">
      <app-pos-product-search-panel />
    </div>
    <div class="lg:col-span-1 lg:sticky lg:top-4">
      <app-pos-cart-panel [submitting]="submitting()" (submitSale)="openSaleReview()" />
    </div>
  </div>

  <!-- Recent sales -->
  <app-pos-recent-sales-list />
</div>

<!-- Sale review / confirmación -->
<app-pos-sale-review-dialog
  [visible]="saleReviewVisible()"
  (visibleChange)="saleReviewVisible.set($event)"
  [submitting]="submitting()"
  (confirm)="confirmSale()"
/>

<!-- Return / devolución dialog -->
<app-pos-return-dialog
  [visible]="returnDialogVisible()"
  (visibleChange)="returnDialogVisible.set($event)"
  (saved)="onReturnSaved($event)"
/>
