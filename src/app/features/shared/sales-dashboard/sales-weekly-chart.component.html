<section
  class="bg-surface-0 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-xl overflow-hidden"
>
  <div
    class="flex flex-col gap-3 border-b border-surface-200 px-4 py-3 dark:border-surface-700 sm:flex-row sm:items-center sm:justify-between"
  >
    <div>
      <h2 class="text-sm font-semibold text-surface-900 dark:text-surface-0">
        Ventas de la semana por día
      </h2>
      <p class="text-xs text-surface-500 dark:text-surface-400">
        Semana {{ weekLabel() }} · Neto {{ netSummary() }}
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button
        pButton
        type="button"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        aria-label="Semana anterior"
        [disabled]="!canMovePrevious()"
        (click)="previousWeek.emit()"
      >
        <i-lucide [img]="icons.ChevronLeft" class="size-4" />
      </button>
      <button
        pButton
        type="button"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        aria-label="Semana siguiente"
        [disabled]="!canMoveNext()"
        (click)="nextWeek.emit()"
      >
        <i-lucide [img]="icons.ChevronRight" class="size-4" />
      </button>
    </div>
  </div>

  <div class="h-72 p-4">
    @if (loading()) {
      <div class="flex h-full flex-col justify-end gap-3">
        @for (_ of [1, 2, 3, 4, 5, 6, 7]; track _) {
          <p-skeleton height="1.5rem" />
        }
      </div>
    } @else if (hasMovement()) {
      <p-chart type="bar" [data]="chartData()" [options]="chartOptions()" height="240" />
    } @else {
      <div
        class="flex h-full items-center justify-center rounded-lg border border-dashed border-surface-200 text-center text-sm text-surface-500 dark:border-surface-700 dark:text-surface-400"
      >
        No hay movimientos para esta semana.
      </div>
    }
  </div>
</section>
