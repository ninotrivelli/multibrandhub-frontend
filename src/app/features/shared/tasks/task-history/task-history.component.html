<section
  class="bg-surface-0 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-xl overflow-hidden"
>
  <h2
    class="text-base font-semibold text-surface-900 dark:text-surface-0 flex items-center gap-2 p-4 md:p-5 pb-0 md:pb-0"
  >
    <i-lucide [img]="icons.History" class="size-4 text-surface-500" />
    Historial de completadas
  </h2>

  <p-table
    [value]="completed()"
    [lazy]="true"
    [paginator]="true"
    [rows]="pageSize()"
    [first]="(page() - 1) * pageSize()"
    [totalRecords]="totalCount()"
    [rowsPerPageOptions]="[10, 20, 50]"
    [loading]="loading()"
    (onLazyLoad)="onLazyLoad($event)"
    dataKey="id"
    styleClass="p-datatable-sm"
    responsiveLayout="scroll"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} tareas"
  >
    <ng-template pTemplate="header">
      <tr>
        <th class="min-w-64 !px-4 md:!px-5">Tarea</th>
        <th class="min-w-28 !px-4 md:!px-5">Tipo</th>
        <th class="min-w-24 !px-4 md:!px-5">Prioridad</th>
        <th class="hidden md:table-cell min-w-40 !px-4 md:!px-5">Completada por</th>
        <th class="min-w-36 !px-4 md:!px-5">Fecha / hora</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-task>
      <tr>
        <td class="!px-4 md:!px-5">
          <div class="flex flex-col min-w-0">
            <span
              class="text-sm text-surface-500 dark:text-surface-400 break-words line-through decoration-surface-400 dark:decoration-surface-500"
            >
              {{ task.description }}
            </span>
            <span class="text-xs text-surface-500 dark:text-surface-400 md:hidden">
              {{ task.completedByName ?? '—' }}
            </span>
          </div>
        </td>
        <td class="!px-4 md:!px-5">
          <p-tag
            [value]="scopeLabel(task)"
            [severity]="scopeSeverityFor(task)"
            styleClass="!text-xs"
          />
        </td>
        <td class="!px-4 md:!px-5">
          <p-tag
            [value]="priorityLabel(task)"
            [severity]="prioritySeverityFor(task)"
            styleClass="!text-xs"
          />
        </td>
        <td class="hidden md:table-cell !px-4 md:!px-5">
          <span class="text-sm text-surface-700 dark:text-surface-200">
            {{ task.completedByName ?? '—' }}
          </span>
        </td>
        <td class="!px-4 md:!px-5">
          <span class="text-sm text-surface-700 dark:text-surface-200">
            {{ task.completedAtUtc | date: 'dd/MM/yy, HH:mm' }}
          </span>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="!px-4 md:!px-5">
          <p class="text-sm text-surface-500 dark:text-surface-400 text-center py-6">
            Todavía no hay tareas completadas.
          </p>
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>
