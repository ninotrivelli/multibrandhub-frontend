<div class="flex flex-col gap-4">
  <p-message severity="warn" variant="outlined" closable="false">
    Estos códigos se muestran una sola vez. Cada uno funciona una única vez y reemplaza a los
    códigos anteriores.
  </p-message>

  @if (sessionInvalidated()) {
    <p-message severity="info" variant="outlined" closable="false">
      La sesión anterior ya fue cerrada. Después de guardar los códigos vas a volver al login.
    </p-message>
  }

  <div
    class="grid grid-cols-1 gap-2 rounded-xl border border-surface-200 bg-surface-50 p-4 font-mono text-sm dark:border-surface-700 dark:bg-surface-900 sm:grid-cols-2"
    aria-label="Códigos de recuperación"
  >
    @for (code of codes(); track code) {
      <code
        class="rounded bg-surface-0 px-3 py-2 text-center text-surface-900 dark:bg-surface-800 dark:text-surface-0"
      >
        {{ code }}
      </code>
    }
  </div>

  <div class="flex flex-col gap-2 sm:flex-row">
    <button pButton type="button" severity="secondary" label="Copiar todos" (click)="copyAll()">
      <i-lucide [img]="icons.Copy" class="mr-2 size-4" />
    </button>
    <button
      pButton
      type="button"
      severity="secondary"
      label="Descargar archivo"
      (click)="download()"
    >
      <i-lucide [img]="icons.Download" class="mr-2 size-4" />
    </button>
  </div>

  <label
    class="flex cursor-pointer items-start gap-3 rounded-lg border border-surface-200 p-3 text-sm dark:border-surface-700"
  >
    <input
      type="checkbox"
      class="mt-0.5 size-4 accent-primary"
      [checked]="acknowledged()"
      (change)="acknowledged.set($any($event.target).checked)"
    />
    <span class="text-surface-700 dark:text-surface-200">
      Confirmo que guardé estos códigos en un lugar seguro.
    </span>
  </label>

  <div class="flex justify-end">
    <button
      pButton
      type="button"
      [label]="sessionInvalidated() ? 'Ir al login' : 'Listo'"
      [disabled]="!acknowledged()"
      (click)="finish()"
    ></button>
  </div>
</div>
