<div class="flex flex-col gap-4">
  <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">Tareas</h1>
      <p class="text-sm text-surface-500 dark:text-surface-400 mt-1">
        Tareas pendientes del local y tuyas. Marcalas al completarlas.
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button
        pButton
        type="button"
        severity="secondary"
        [text]="true"
        label="Actualizar"
        [disabled]="loading()"
        (click)="refresh()"
      >
        <i-lucide [img]="icons.RefreshCw" class="size-4 mr-2" />
      </button>
      <button pButton type="button" label="Nueva tarea" (click)="openCreate()">
        <i-lucide [img]="icons.Plus" class="size-4 mr-2" />
      </button>
    </div>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
    <section
      class="bg-surface-0 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-xl p-4 md:p-5"
    >
      <h2
        class="text-base font-semibold text-surface-900 dark:text-surface-0 mb-2 flex items-center gap-2"
      >
        <i-lucide [img]="icons.Users" class="size-4 text-surface-500" />
        Tareas del Local
        <span class="text-xs font-normal text-surface-400 dark:text-surface-500">
          · Visibles por todo el equipo
        </span>
      </h2>
      <app-task-list
        [tasks]="generalPending()"
        [loading]="loading()"
        [completingIds]="completingIds()"
        emptyMessage="No hay tareas pendientes."
        (completeTask)="onComplete($event)"
      />
    </section>

    <section
      class="bg-surface-0 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-xl p-4 md:p-5"
    >
      <h2
        class="text-base font-semibold text-surface-900 dark:text-surface-0 mb-2 flex items-center gap-2"
      >
        <i-lucide [img]="icons.Lock" class="size-4 text-surface-500" />
        Mis Tareas
        <span class="text-xs font-normal text-surface-400 dark:text-surface-500">
          · Solo las ves vos
        </span>
      </h2>
      <app-task-list
        [tasks]="personalPending()"
        [loading]="loading()"
        [completingIds]="completingIds()"
        emptyMessage="No tenés tareas personales pendientes."
        (completeTask)="onComplete($event)"
      />
    </section>
  </div>

  <app-task-history />
</div>

<app-task-form-dialog
  [visible]="dialogVisible()"
  [canCreatePersonal]="true"
  (visibleChange)="onDialogVisibleChange($event)"
/>
