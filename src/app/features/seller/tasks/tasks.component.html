<div class="flex flex-col gap-4">
  <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">Tareas Diarias</h1>
      <p class="text-sm text-surface-500 dark:text-surface-400 mt-1">
        Tareas del local pendientes para hoy. Marcalas al completarlas.
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button
        pButton
        type="button"
        severity="secondary"
        [text]="true"
        label="Actualizar"
        [disabled]="loading()"
        (click)="refresh()"
      >
        <i-lucide [img]="icons.RefreshCw" class="size-4 mr-2" />
      </button>
      <button pButton type="button" label="Nueva tarea" (click)="openCreate()">
        <i-lucide [img]="icons.Plus" class="size-4 mr-2" />
      </button>
    </div>
  </header>

  <section
    class="bg-surface-0 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-xl p-4 md:p-5"
  >
    <app-task-list
      [tasks]="generalPending()"
      [loading]="loading()"
      [completingIds]="completingIds()"
      emptyMessage="No hay tareas pendientes. ¡Buen trabajo!"
      (completeTask)="onComplete($event)"
    />
  </section>

  <app-task-history scope="General" />
</div>

<app-task-form-dialog
  [visible]="dialogVisible()"
  [canCreatePersonal]="false"
  (visibleChange)="onDialogVisibleChange($event)"
/>
